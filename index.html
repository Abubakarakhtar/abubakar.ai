<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ABU BAKAR AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #06110c;
      color: white;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 25px 15px;
    }

    .header {
      text-align: center;
      padding: 35px 10px 25px;
    }

    .status {
      display: inline-block;
      padding: 8px 14px;
      border-radius: 50px;
      border: 1px solid #2b8a60;
      color: #72e6ad;
      background: #0b2118;
      font-size: 13px;
    }

    h1 {
      font-size: clamp(45px, 10vw, 80px);
      margin: 18px 0 8px;
      letter-spacing: -4px;
    }

    .subtitle {
      color: #a8bdb3;
      font-size: 17px;
    }

    .chat {
      background: #0b1712;
      border: 1px solid #1d3b2c;
      border-radius: 24px;
      padding: 15px;
      box-shadow: 0 20px 70px rgba(0,0,0,.4);
    }

    #messages {
      height: 55vh;
      min-height: 320px;
      overflow-y: auto;
      padding: 10px;
    }

    .message {
      max-width: 85%;
      padding: 14px 16px;
      margin: 10px 0;
      border-radius: 17px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .assistant {
      background: #10261b;
      border: 1px solid #1d4b36;
    }

    .user {
      margin-left: auto;
      background: #1c6948;
    }

    .input-area {
      display: flex;
      gap: 10px;
      border-top: 1px solid #1d3b2c;
      padding-top: 14px;
    }

    #input {
      flex: 1;
      min-width: 0;
      padding: 15px;
      border-radius: 14px;
      border: 1px solid #28543f;
      background: #07110d;
      color: white;
      font-size: 16px;
      outline: none;
    }

    #send {
      padding: 0 22px;
      border: 0;
      border-radius: 14px;
      background: #69e0a7;
      color: #06110b;
      font-weight: bold;
      cursor: pointer;
    }

    #send:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .footer {
      text-align: center;
      color: #718a7e;
      font-size: 13px;
      padding: 18px;
    }

    @media(max-width:600px) {
      .input-area {
        flex-direction: row;
      }

      #send {
        padding: 0 17px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <header class="header">

    <div class="status">
      ● ABU BAKAR AI
    </div>

    <h1>ABU BAKAR</h1>

    <div class="subtitle">
      Your personal AI assistant
    </div>

  </header>


  <section class="chat">

    <div id="messages">

      <div class="message assistant">
        Assalamu Alaikum! 👋

        I am ABU BAKAR, your personal AI agent.

        How can I help you today?
      </div>

    </div>


    <div class="input-area">

      <input
        id="input"
        type="text"
        placeholder="Message ABU BAKAR..."
        autocomplete="off"
      >

      <button id="send">
        Send
      </button>

    </div>

  </section>


  <div class="footer">
    ABU BAKAR AI • Secure AI connection
  </div>

</div>


<script>

const input = document.getElementById("input");
const sendButton = document.getElementById("send");
const messages = document.getElementById("messages");


function addMessage(text, type) {

  const div = document.createElement("div");

  div.className = "message " + type;

  div.textContent = text;

  messages.appendChild(div);

  messages.scrollTop = messages.scrollHeight;
}


async function sendMessage() {

  const text = input.value.trim();

  if (!text) return;

  addMessage(text, "user");

  input.value = "";

  sendButton.disabled = true;

  sendButton.textContent = "...";


  try {

    const response = await fetch(
      "https://abu-bakar-ai-bakars-projects-af0d9269.vercel.app/api/chat",
      {
        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({

          messages: [

            {
              role: "user",
              content: text
            }

          ]

        })
      }
    );


    const data = await response.json();


    if (!response.ok) {

      throw new Error(
        data.error || "AI server error"
      );

    }


    addMessage(
      data.reply || "No response received.",
      "assistant"
    );


  } catch (error) {

    addMessage(
      "❌ AI connection error: " + error.message,
      "assistant"
    );

  }


  sendButton.disabled = false;

  sendButton.textContent = "Send";

}


sendButton.addEventListener(
  "click",
  sendMessage
);


input.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "Enter") {

      sendMessage();

    }

  }
);

</script>

</body>
</html>
