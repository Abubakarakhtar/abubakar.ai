<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ABU BAKAR AI</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial;background:#f3fbf5;color:#173b2a}
.app{max-width:900px;margin:auto;height:100vh;display:flex;flex-direction:column;background:#fff}
header{padding:18px 20px;background:#dff5e5;border-bottom:1px solid #bfe4c9;display:flex;justify-content:space-between;align-items:center}
h1{margin:0;font-size:22px}header small{opacity:.7}
#chat{flex:1;overflow:auto;padding:20px;background:#fbfffc}
.msg{max-width:80%;padding:12px 15px;border-radius:16px;margin:10px 0;white-space:pre-wrap;line-height:1.45}
.user{margin-left:auto;background:#bfe8c9}.ai{background:#e9f7ed;border:1px solid #d0ead7}
.bar{display:flex;gap:8px;padding:12px;border-top:1px solid #cfe7d5;background:#fff}
input{flex:1;padding:13px;border:1px solid #b8d9c0;border-radius:12px;font-size:16px;outline:none}
button{border:0;border-radius:12px;padding:12px 16px;background:#279653;color:white;font-weight:700;cursor:pointer}
button.secondary{background:#e4f3e8;color:#176333}
footer{padding:8px 14px;text-align:center;font-size:11px;color:#66806e}
</style>
</head>
<body>
<div class="app">
<header><div><h1>🤖 ABU BAKAR AI</h1><small>AI Assistant</small></div><button class="secondary" onclick="settings()">⚙ API</button></header>
<div id="chat"></div>
<div class="bar"><input id="input" placeholder="Ask ABU BAKAR anything..." onkeydown="if(event.key==='Enter')send()"><button onclick="send()">Send</button></div>
<footer>API key is stored only in this browser. For production, use a server-side API proxy.</footer>
</div>
<script>
const chat=document.getElementById('chat'), input=document.getElementById('input');
let history=JSON.parse(localStorage.getItem('abu_bakar_history')||'[]');
function render(){chat.innerHTML='';history.forEach(x=>add(x.role==='user'?'user':'ai',x.content));chat.scrollTop=chat.scrollHeight}
function add(c,t){let d=document.createElement('div');d.className='msg '+c;d.textContent=t;chat.appendChild(d)}
async function send(){
 let text=input.value.trim(); if(!text)return;
 input.value=''; history.push({role:'user',content:text}); add('user',text);
 let api=localStorage.getItem('abu_api'), key=localStorage.getItem('abu_key'), model=localStorage.getItem('abu_model')||'gpt-4o-mini';
 if(!api||!key){add('ai','Please open ⚙ API and enter your API endpoint and key first.');return}
 let wait=document.createElement('div');wait.className='msg ai';wait.textContent='Thinking...';chat.appendChild(wait);
 try{
  let r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
   body:JSON.stringify({model,messages:[{role:'system',content:'You are ABU BAKAR, a helpful, respectful AI assistant.'},...history]})});
  let data=await r.json(); if(!r.ok)throw new Error(data.error?.message||'API request failed');
  let answer=data.choices?.[0]?.message?.content||data.output_text||'No response received.';
  wait.remove();add('ai',answer);history.push({role:'assistant',content:answer});localStorage.setItem('abu_bakar_history',JSON.stringify(history));
 }catch(e){wait.textContent='API Error: '+e.message}
}
function settings(){
 let api=prompt('API endpoint:',localStorage.getItem('abu_api')||'https://api.openai.com/v1/chat/completions'); if(api===null)return;
 let key=prompt('API key (stored locally in this browser):',localStorage.getItem('abu_key')||''); if(key===null)return;
 let model=prompt('Model:',localStorage.getItem('abu_model')||'gpt-4o-mini'); if(model===null)return;
 localStorage.setItem('abu_api',api);localStorage.setItem('abu_key',key);localStorage.setItem('abu_model',model);alert('API settings saved.');
}
if(!history.length){history=[{role:'assistant',content:'Assalam-o-Alaikum! I am ABU BAKAR AI. Configure your API with ⚙ API, then ask me anything.'}]}
render();
</script>
</body>
</html>
